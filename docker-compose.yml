services:
  postgres:
    image: postgres:17-alpine
    container_name: socialnetwork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_network
      POSTGRES_USER: socialnetwork
      POSTGRES_PASSWORD: local_dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - socialnetwork_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialnetwork -d social_network"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  socialnetwork_postgres_data:
